<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1C2566">
    <title>Offline - Tropang Potchi</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            background: #1C2566;
            color: #FFFFFF;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }
        main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        img { width: 96px; height: 96px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
        p { margin: 0; color: #DCE0F5; font-size: 15px; line-height: 1.5; }
        button {
            min-height: 48px;
            padding: 0 24px;
            border: 0;
            border-radius: 12px;
            background: #F5D547;
            color: #16181D;
            font: 700 15px Inter, system-ui, sans-serif;
            cursor: pointer;
        }
        button:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="Tropang Potchi Brotherhood logo">
        <h1>You’re offline</h1>
        <p>Tropang Potchi needs a connection to show member records. Check your signal or Wi-Fi, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
