<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birthdays and dates – Tropang Potchi app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3446B0}a:hover{color:#1C2566}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F6F5EF; font-family: Inter, system-ui, sans-serif; color: #16181D">

<header style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 12px">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.01em">Birthdays</h1>
<button type="button" onClick="{{today}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D6D3C6; background: #FFFFFF; color: #16181D; font: 600 13px Inter, sans-serif; cursor: pointer">Today</button>
</header>

<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px">

<section aria-label="Month calendar" style="margin: 0 16px; background: #FFFFFF; border: 1px solid #E4E2D8; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Previous month" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: #16181D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<h2 style="margin: 0; font-family: Archivo, sans-serif; font-size: 18px; font-weight: 800">{{monthLabel}}</h2>
<button type="button" aria-label="Next month" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: #16181D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{dows}}" as="d" hint-placeholder-count="7">
<span style="text-align: center; font-size: 11px; font-weight: 700; color: #5C6070; padding: 4px 0">{{d}}</span>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<sc-if value="{{c.blank}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
<sc-if value="{{c.real}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{c.label}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">
<span>{{c.day}}</span>
<span style="display: flex; gap: 3px; height: 6px">
<sc-for list="{{c.dots}}" as="dot" hint-placeholder-count="0"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{dot}}"></span></sc-for>
</span>
</button>
</sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 14px; padding: 4px 4px 0; font-size: 12px; color: #5C6070">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E0A800"></span>Birthday</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3446B0"></span>Activity</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0B7A80"></span>Org update</span>
</div>
</section>

<section aria-labelledby="day-h" style="margin: 0 16px; display: flex; flex-direction: column; gap: 8px">
<h2 id="day-h" style="margin: 0; font-size: 15px; font-weight: 700">{{dayLabel}}</h2>
<sc-if value="{{dayEmpty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: 1px dashed #D6D3C6; font-size: 14px; color: #5C6070">Nothing on this day.</p>
</sc-if>
<sc-for list="{{dayItems}}" as="it" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E2D8">
<span style="width: 10px; height: 40px; border-radius: 999px; background: {{it.color}}; flex: 0 0 auto"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{it.title}}</span>
<span style="font-size: 12px; color: #5C6070">{{it.detail}}</span>
</span>
</div>
</sc-for>
</section>

<section aria-labelledby="up-h" style="margin: 0 16px; background: #FFFFFF; border: 1px solid #E4E2D8; border-radius: 16px; padding: 6px 16px">
<h2 id="up-h" style="margin: 0; padding: 12px 0 4px; font-size: 16px; font-weight: 700">Next 60 days</h2>
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{upcoming}}" as="p" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #F0EEE6">
<span style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px; background: #FFF6D1; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 10px; font-weight: 700; color: #7A4A00; letter-spacing: 0.06em">{{p.mon}}</span>
<span style="font-family: Archivo, sans-serif; font-size: 17px; font-weight: 800; line-height: 1">{{p.day}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 12px; color: #5C6070">{{p.detail}}</span>
</span>
<span style="font-size: 12px; font-weight: 600; color: #5C6070; white-space: nowrap">{{p.inDays}}</span>
</li>
</sc-for>
</ul>
</section>

</main>

<nav aria-label="Main" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 20px; background: #FFFFFF; border-top: 1px solid #E4E2D8">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5C6070; font-size: 11px; font-weight: 500"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></span>Home</a>
<a href="Members.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5C6070; font-size: 11px; font-weight: 500"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21c0-3-2-5-4-5.6"></path></svg></span>Members</a>
<a href="Attendance.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5C6070; font-size: 11px; font-weight: 500"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"></path></svg></span>Attendance</a>
<a href="Calendar.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #1C2566; font-size: 11px; font-weight: 700"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 999px; background: #F5D547"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16v-8H4zM4 17h16M12 13V9M12 6a1.5 1.5 0 0 1-1.5-1.5C10.5 3 12 2 12 2s1.5 1 1.5 2.5A1.5 1.5 0 0 1 12 6z"></path><path d="M7 13v-2h10v2"></path></svg></span>Birthdays</a>
<a href="More.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5C6070; font-size: 11px; font-weight: 500"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></span>More</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var TP_BD = [['Aidreianne Feb T. Serenio','Pebpeb',2,19,2008],['Andrei Klaus T. Serenio','Dol',6,7,2006],['Axel Niza Bartolome','',7,2,2006],['Bjay Cuizon','',5,19,2008],['Chrej Rigel Simbahon','',4,22,0],['Christoff Liel Indab','Tope',12,14,0],['Edrian M. Cagabhion','Samboy',12,18,0],['Jedie Ezekiel O. Arcala','',6,7,2009],['Jeffrey Oliver Gumobao','Jepoy',10,19,2006],['Jhonpaul M. Inting','Burn',7,9,2009],['John Ronryl Edig','Jan²',12,25,2007],['Jerald Nonato','Jumong',7,8,0],['John Lloyd Lagbawan','Batotin',6,22,0],['John Michael Balones','Soy²',1,21,0],['Jan Griz Cartagena','Kim²',12,26,2010],['Louie Jan N. Cagabhion','Loy',10,7,0],['Loyd T. Rabe','',10,26,0],['Randave N. Cagabhion','Dave',4,17,2006],['Rey Tilago','Duday',5,5,2007],['Ricky S. Tilago','Proktoy',7,19,2007],['James Cartagena','Bojik',7,3,2009],['Vince Dane Sumalinog','Dodong',8,9,2010],['Clark Jiro Marquez','CJ',7,28,2009],['Jayron Perez','',4,9,2012],['Jhon Gabriel Suzon','',5,22,2011],['Arnel Jay Adrian S. Cañas','Adrian',1,3,2014]];
var TP_DATES = [[2024,5,26,'Leiana Outing','act'],[2024,5,29,'Graduation','act'],[2024,5,30,'Graduation','act'],[2024,10,6,'Untitled activity','act'],[2025,12,16,'Wake','act'],[2025,12,30,'Year-End Bonding','act'],[2024,5,2,'Org Chart 2024 published','org'],[2025,10,1,'Members list updated','org'],[2025,10,5,'Org chart updated','org'],[2026,3,2,'6 members set inactive','org']];
var TP_MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var TP_TODAY = { y: 2026, m: 11, d: 22 };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { y: 2026, m: 12, d: 14 }; }
  shift(n) {
    var m = this.state.m + n, y = this.state.y;
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    this.setState({ y: y, m: m, d: 0 });
  }
  itemsOn(y, m, d) {
    var items = [];
    TP_BD.forEach(function (b) {
      if (b[2] === m && b[3] === d) items.push({ title: b[0] + (b[1] ? ' (' + b[1] + ')' : ''), detail: 'Birthday · ' + (b[4] ? 'turns ' + (y - b[4]) : 'birth year missing'), color: '#E0A800', kind: 'b' });
    });
    TP_DATES.forEach(function (e) {
      if (e[0] === y && e[1] === m && e[2] === d) items.push({ title: e[3], detail: e[4] === 'act' ? 'Activity' : 'Org update', color: e[4] === 'act' ? '#3446B0' : '#0B7A80', kind: e[4] });
    });
    return items;
  }
  renderVals() {
    var self = this, s = this.state;
    var first = new Date(s.y, s.m - 1, 1).getDay();
    var days = new Date(s.y, s.m, 0).getDate();
    var cells = [];
    for (var i = 0; i < first; i++) cells.push({ blank: true, real: false });
    for (var d = 1; d <= days; d++) {
      (function (d) {
        var items = self.itemsOn(s.y, s.m, d);
        var on = d === s.d;
        var isToday = s.y === TP_TODAY.y && s.m === TP_TODAY.m && d === TP_TODAY.d;
        var seen = {}, dots = [];
        items.forEach(function (it) { if (!seen[it.color]) { seen[it.color] = 1; dots.push(on ? '#F5D547' : it.color); } });
        cells.push({ blank: false, real: true, day: d, on: on, dots: dots,
          label: TP_MON[s.m - 1] + ' ' + d + (items.length ? ', ' + items.length + ' event' + (items.length > 1 ? 's' : '') : ''),
          pick: function () { self.setState({ d: d }); },
          style: 'height: 46px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: ' + (on || isToday ? '700' : '500') + ' 14px Inter, sans-serif; border: ' + (isToday && !on ? '2px solid #3446B0' : '0') + '; background: ' + (on ? '#1C2566' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : isToday ? '#3446B0' : '#16181D') });
      })(d);
    }
    var dayItems = s.d ? this.itemsOn(s.y, s.m, s.d) : [];
    var start = new Date(2026, 10, 22), upcoming = [];
    TP_BD.forEach(function (b) {
      var y = 2026, dt = new Date(y, b[2] - 1, b[3]);
      if (dt < start) { y = 2027; dt = new Date(y, b[2] - 1, b[3]); }
      var diff = Math.round((dt - start) / 86400000);
      if (diff <= 60) upcoming.push({ diff: diff, mon: TP_MON[b[2] - 1].slice(0, 3).toUpperCase(), day: b[3], name: b[0],
        detail: (b[1] ? b[1] + ' · ' : '') + (b[4] ? 'turns ' + (y - b[4]) : 'birth year missing'), inDays: diff === 0 ? 'today' : 'in ' + diff + ' days' });
    });
    upcoming.sort(function (a, b) { return a.diff - b.diff; });
    return {
      monthLabel: TP_MON[s.m - 1] + ' ' + s.y, cells: cells, upcoming: upcoming,
      dows: ['S', 'M', 'T', 'W', 'T', 'F', 'S'],
      dayLabel: s.d ? TP_MON[s.m - 1] + ' ' + s.d : 'Tap a day to see what’s on',
      dayItems: dayItems, dayEmpty: !!s.d && dayItems.length === 0,
      prev: function () { self.shift(-1); }, next: function () { self.shift(1); },
      today: function () { self.setState({ y: TP_TODAY.y, m: TP_TODAY.m, d: TP_TODAY.d }); }
    };
  }
}
</script>
</body>
</html>
